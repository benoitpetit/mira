run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - gosec       # Security-related checks
    - goconst     # Repeated strings that could be constants
    - misspell    # Common English misspellings
    - gocritic    # Broad set of code quality checks
    - unconvert   # Unnecessary type conversions
    - unparam     # Unused function parameters
    - ineffassign  # Ineffective assignments
    - unused       # Unused code
    - staticcheck  # Comprehensive static analysis

linters-settings:
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files may use longer functions and more lenient patterns
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - unparam
    # Generated code exclusions
    - path: _generated\.go
      linters:
        - unused
        - gocritic

severity:
  default-severity: warning
