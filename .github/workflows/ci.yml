name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master", "dev", "develop" ]
    tags-ignore:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -tags fts5 -v -race ./...

  build:
    name: Build
    runs-on: ${{ matrix.runner }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-22.04
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            runner: macos-14
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            runner: windows-2022
            suffix: windows-amd64.exe
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            suffix: windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install OpenSSL development files (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure OpenSSL (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "CGO_CFLAGS=-I$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Configure OpenSSL (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $root = Get-ChildItem 'C:\Program Files' -Directory -Filter 'OpenSSL*' | Select-Object -First 1
          if (-not $root) {
            choco install openssl.light --no-progress --yes
            $root = Get-ChildItem 'C:\Program Files' -Directory -Filter 'OpenSSL*' | Select-Object -First 1
          }
          if (-not $root) { throw 'OpenSSL installation directory not found' }
          $shortRoot = (& cmd.exe /c ('for %I in ("' + $root.FullName + '") do @echo %~sI')).Trim()
          if (-not $shortRoot) { throw 'Unable to resolve short OpenSSL path' }
          "CGO_CFLAGS=-I$shortRoot\include" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$shortRoot\lib" >> $env:GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          go build -tags fts5 -ldflags="-s -w" -o mira-${{ matrix.suffix }} ./cmd/mira

      - name: Smoke test binary
        shell: bash
        run: ./mira-${{ matrix.suffix }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mira-${{ matrix.suffix }}
