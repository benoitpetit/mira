name: CI

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master", "dev", "develop" ]
    tags-ignore:
      - 'v*'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o mira-${GOOS}-${GOARCH}${EXT} ./cmd/mira

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mira-${{ matrix.goos }}-${{ matrix.goarch }}*