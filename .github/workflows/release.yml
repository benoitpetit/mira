name: Release

on:
  push:
    branches:
      - prod
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.runner }}
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            runner: ubuntu-22.04
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
            runner: windows-2022
            msystem: UCRT64
            msys2_subdir: ucrt64
            msys2_packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-openssl
          - goos: windows
            goarch: arm64
            suffix: windows-arm64.exe
            runner: windows-11-arm
            msystem: CLANGARM64
            msys2_subdir: clangarm64
            msys2_packages: mingw-w64-clang-aarch64-gcc-compat mingw-w64-clang-aarch64-openssl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install OpenSSL development files (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Configure OpenSSL (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "CGO_CFLAGS=-I$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"

      - name: Set up MSYS2 toolchain (Windows)
        if: matrix.goos == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: inherit
          install: ${{ matrix.msys2_packages }}

      - name: Configure MSYS2 OpenSSL (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $root = Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.msys2_subdir }}'
          "$root\bin" >> $env:GITHUB_PATH
          "CC=$root\bin\gcc.exe" >> $env:GITHUB_ENV
          "CGO_CFLAGS=-I$root\include" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$root\lib" >> $env:GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -tags fts5 -ldflags="-s -w" -o dist/mira-${{ matrix.suffix }} ./cmd/mira

      - name: Smoke test binary
        shell: bash
        run: ./dist/mira-${{ matrix.suffix }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mira-${{ matrix.suffix }}
          path: dist/mira-${{ matrix.suffix }}
          retention-days: 1

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run tests
        run: go test -tags fts5 -v -race ./...

  release:
    name: Create Draft Release
    needs: [build, test]
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    if: github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mira-*

      - name: Prepare release assets
        run: |
          cd dist
          for dir in mira-*; do
            if [ -d "$dir" ]; then
              chmod +x "$dir"/*
              # Create tarball for non-Windows
              if [[ "$dir" != *windows* ]]; then
                tar -czf "${dir}.tar.gz" -C "$dir" .
              else
                # Create zip for Windows
                (cd "$dir" && zip -r "../${dir}.zip" .)
              fi
            fi
          done
          sha256sum mira-*.tar.gz mira-*.zip > SHA256SUMS
          ls -la

      - name: Get version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -E 'Version:\s*"[0-9]+\.[0-9]+\.[0-9]+"' internal/config/config.go | head -1 | grep -o '"[0-9.]*"' | tr -d '"')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create Draft Release
        uses: softprops/action-gh-release@v1
        with:
          name: MIRA v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          body: |
            ## MIRA v${{ steps.get_version.outputs.version }}

            ### 📦 Binaries

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | amd64 | `mira-linux-amd64.tar.gz` |
            | Linux | arm64 | `mira-linux-arm64.tar.gz` |
            | macOS | amd64 | `mira-darwin-amd64.tar.gz` |
            | macOS | arm64 | `mira-darwin-arm64.tar.gz` |
            | Windows | amd64 | `mira-windows-amd64.exe.zip` |
            | Windows | arm64 | `mira-windows-arm64.exe.zip` |

            ### 🚀 Quick Start

            ```bash
            # Linux/macOS
            tar -xzf mira-linux-amd64.tar.gz
            ./mira --version

            # Windows
            unzip mira-windows-amd64.exe.zip
            .\mira.exe --version
            ```

            ### 📝 Configuration

            1. Copy example config: `cp config.example.yaml config.yaml`
            2. Edit `config.yaml` to match your environment
            3. Run: `./mira`

            ### 📋 Changelog

            See [CHANGELOG.md](CHANGELOG.md) for details.

            ---
            **⚠️ This is a draft release. Please review before publishing.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
